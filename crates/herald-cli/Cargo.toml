[package]
name = "herald-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "herald"
path = "src/main.rs"

[dependencies]
herald-core = { workspace = true, features = ["semantic"] }
herald-tui = { path = "../herald-tui" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
herald-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
